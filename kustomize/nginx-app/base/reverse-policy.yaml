apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-reverse
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-reverse
  template:
    metadata:
      labels:
        app: nginx-reverse
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.0
          resources:
            limits:
              memory: '128Mi'
              cpu: '500m'
            requests:
              memory: '128Mi'
              cpu: '500m'
          ports:
            - containerPort: 80
