apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-inside-dep
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-inside-dep
  template:
    metadata:
      labels:
        app: nginx-inside-dep
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.0
          resources:
            limits:
              memory: '128Mi'
              cpu: '500m'
            requests:
              memory: '128Mi'
              cpu: '500m'
          ports:
            - containerPort: 80
          volumeMounts:
            - name: db-config
              mountPath: /data/config
      volumes:
        - name: db-config
          configMap:
            name: db-init-config
