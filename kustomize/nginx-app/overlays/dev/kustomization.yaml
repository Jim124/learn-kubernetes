apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
namePrefix: dev-
nameSuffix: -v1
commonLabels:
  tier: backend
  team: finance
commonAnnotations:
  developer: 'test@example.com'
  repository: 'github.com'
  maintainer: 'test@example.com'
images:
  - name: nginx
    newTag: 1.0.1
replicas:
  - name: nginx
    count: 3
resources:
  - ../../base
