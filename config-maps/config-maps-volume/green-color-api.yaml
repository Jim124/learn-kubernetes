apiVersion: v1
kind: Pod
metadata:
  name: green-color-api
  labels:
    name: green-color-api
spec:
  containers:
    - name: color-api
      image: jim124/color-api:1.3.0
      env:
        - name: COLOR_PATH
          valueFrom:
            configMapKeyRef:
              key: COLOR_PATH
              name: green-env-vars
      resources:
        limits:
          memory: '128Mi'
          cpu: '500m'
        requests:
          memory: '128Mi'
          cpu: '500m'
      ports:
        - containerPort: 80
      volumeMounts:
        - name: color-config
          mountPath: /mnt/config
          readOnly: true

  volumes:
    - name: color-config
      configMap:
        name: green-config-vol
