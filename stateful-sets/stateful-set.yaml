apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-ss
spec:
  selector:
    matchLabels:
      app: busybox
  serviceName: busybox
  replicas: 2
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
        - name: busybox
          image: busybox:1.36.1
          command:
            - 'sh'
            - '-c'
            - 'sleep 3600'
          resources:
            limits:
              memory: '128Mi'
              cpu: '500m'
          volumeMounts:
            - name: local-volume
              mountPath: /mnt/local
  volumeClaimTemplates:
    - metadata:
        name: local-volume
      spec:
        accessModes:
          - ReadWriteOnce
        #storageClassName: local-storage static persistent volume
        storageClassName: standard # dynamic persistent volume
        resources:
          requests:
            storage: 128Mi
