apiVersion: v1
kind: Pod
metadata:
  name: empty-dir-demo
  labels:
    app: empty-dir-demo
spec:
  containers:
    - name: empty-dir-write
      image: busybox:1.36.1
      command:
        - 'sh'
        - '-c'
        - 'sleep 3600'
      resources:
        limits:
          memory: '128Mi'
          cpu: '500m'
        requests:
          memory: '128Mi'
          cpu: '500m'
      volumeMounts:
        - name: temporary-storage
          mountPath: /usr/share/temp
    - name: empty-dir-read
      image: busybox:1.36.1
      command:
        - 'sh'
        - '-c'
        - 'sleep 3600'
      resources:
        limits:
          memory: '128Mi'
          cpu: '500m'
        requests:
          memory: '128Mi'
          cpu: '500m'
      volumeMounts:
        - name: temporary-storage
          mountPath: /data/log
          readOnly: true
  volumes:
    - name: temporary-storage
      emptyDir:
        {}
        #medium: Memory
        #sizeLimit: 256Mi
