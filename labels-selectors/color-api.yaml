apiVersion: v1
kind: Pod
metadata:
  name: color-backend
  labels:
    app: color-api
    environment: local
    tier: backend
spec:
  containers:
    - name: color-backend
      image: jim124/color-api:1.1.0

      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: color-frontend
  labels:
    app: color-api
    environment: local
    tier: frontend
spec:
  containers:
    - name: color-api
      image: nginx:1.27.0
      ports:
        - containerPort: 80
