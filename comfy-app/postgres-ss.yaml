apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-ss
spec:
  selector:
    matchLabels:
      app: postgresDb
  serviceName: postgres-svc
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresDb
    spec:
      containers:
        - name: postgres
          image: postgres:14.17
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  key: dbName
                  name: postgres-init-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: postgres-cred
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-cred

          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init-config
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init-config
          configMap:
            name: postgres-init-db
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
