apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
  namespace: dev
spec:
  replicas: 4
  selector:
    matchLabels:
      app: color-api
  template:
    metadata:
      labels:
        app: color-api
    spec:
      containers:
        - name: color-api
          image: jim124/color-api:1.1.0
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              memory: '512Mi'
              cpu: '500m'
          ports:
            - containerPort: 80
